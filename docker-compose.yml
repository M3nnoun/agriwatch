services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: agriwatch
      POSTGRES_USER: agriwatch
      POSTGRES_PASSWORD: agriwatch_dev
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agriwatch']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports: ['3000:3000']
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agriwatch:agriwatch_dev@db:5432/agriwatch
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID:-}
      DEMO_MODE: 'true'
      NEXT_PUBLIC_DEMO_MODE: 'true'

volumes:
  postgres_data:
